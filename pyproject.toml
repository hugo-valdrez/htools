[tool.poetry]
name = "htools"
version = "0.1.0"
description = "Hugo’s Utility Tools: A collection of scripts and tools that I’ve found handy for daily use and beyond."
authors = ["valdrez"]

packages = [
  { include = "htools_cli" },
  { include = "utils" },
  { include = "weekly_meals" },
  { include = "file_converter" },
  { include = "data_visualizer" },
  { include = "anki" },
]

[tool.poetry.scripts]
htools = "htools_cli:main"

[tool.poetry.dependencies]
python = "^3.11"
polars = "^1.0.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
