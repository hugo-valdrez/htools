default_profile: default

profiles:
  default:
    plan_size: 7
    rules:
      - id: tofu_exact
        type: count
        where:
          attr: protein
          eq: Tofu
        op: eq
        value: 2

      - id: fish_exact
        type: count
        where:
          attr: protein
          eq: Fish
        op: eq
        value: 1

      - id: legume_exact
        type: count
        where:
          attr: legume
          exists: true
        op: lte
        value: 3

      - id: pasta_min
        type: count
        where:
          attr: carb
          eq: Pasta
        op: gte
        value: 1

      - id: rice_min
        type: count
        where:
          attr: carb
          eq: Rice
        op: gte
        value: 1

      - id: potato_min
        type: count
        where:
          attr: carb
          eq: Potato
        op: gte
        value: 1

      - id: max_same_legume
        type: max_frequency
        key: legume
        ignore_null: true
        op: lte
        value: 1

      - id: soup_max
        type: count
        where:
          attr: is_soup
          eq: true
        op: lte
        value: 1
